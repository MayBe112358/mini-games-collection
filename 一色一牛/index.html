<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>一色一牛</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" media="print" onload="this.media='all'">
<style>
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* layout: one narrow column. The board sits in a soft tray and is the only colourful thing; regions are merged blobs, chrome stays quiet */
:root{
  --bg:#eef3ea;--tray:#dce5d6;--surface:#ffffff;--ink:#1c2a23;--muted:#5d6c64;--line:rgba(28,42,35,.13);
  --accent:#2c7a4b;--accent-soft:rgba(44,122,75,.12);--on-accent:#ffffff;--danger:#cf3b2f;--mark:rgba(20,30,25,.5);--knob:#ffffff;
  --rp:100%;--rb:#0d1410;--cow:#ffffff;--patch:#22302a;--muzzle:#f5b5ae;--shadow:0 1px 2px rgba(28,42,35,.06),0 8px 24px rgba(28,42,35,.07);
  --r0:#a394dc;--r1:#f4ad7c;--r2:#82bfe3;--r3:#b9dba1;--r4:#f1ade8;--r5:#e0c268;
  --r6:#6fbab5;--r7:#cf88a8;--r8:#bd9470;--r9:#b4c2dc;--r10:#7990c6;--r11:#edc9d8;
  --display:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1512;--tray:#1c2620;--surface:#18211c;--ink:#e6eee8;--muted:#98a99f;--line:rgba(230,238,232,.13);
  --accent:#6fcf97;--accent-soft:rgba(111,207,151,.14);--on-accent:#0d1410;--danger:#ff6b5e;--knob:#cdd8d1;
  --rp:84%;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512;--tray:#1c2620;--surface:#18211c;--ink:#e6eee8;--muted:#98a99f;--line:rgba(230,238,232,.13);
  --accent:#6fcf97;--accent-soft:rgba(111,207,151,.14);--on-accent:#0d1410;--danger:#ff6b5e;--knob:#cdd8d1;
  --rp:84%;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent;
  padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1;margin:0;display:flex;align-items:center;gap:8px;white-space:nowrap}
h1 svg{width:36px;height:36px;flex:none}
.pill{display:inline-flex;align-items:baseline;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;min-width:0}
.pill b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill span{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.rules{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rules li{display:flex;align-items:center;gap:8px;font-size:12.5px;line-height:1.35;color:var(--muted);min-width:0}
.rules svg{width:30px;height:30px;flex:none}
.rules b{display:block;color:var(--ink);font-weight:600;font-size:13px}
.status{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:2px}
#pips{display:flex;gap:5px;flex-wrap:wrap}
#pips i{width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--muted);opacity:.55;transition:background .2s,opacity .2s,transform .2s}
#pips i.on{background:var(--accent);box-shadow:none;opacity:1;transform:scale(1.1)}
#time{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
#time svg{width:15px;height:15px;color:var(--muted)}
.tray{background:var(--tray);border-radius:18px;padding:7px;box-shadow:var(--shadow)}
#board{display:grid;width:100%;aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none}
.cell{all:unset;position:relative;display:block;min-width:0;min-height:0;cursor:pointer}
.fill{position:absolute;pointer-events:none;background:color-mix(in srgb,var(--c) var(--rp),var(--rb));box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14);transition:filter .12s}
.cell:hover .fill{filter:brightness(1.05)}
.cell:active .fill{filter:brightness(.92)}
.cell:focus-visible .fill{box-shadow:inset 0 0 0 3px var(--ink)}
.in{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.in svg{width:80%;height:80%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.x{position:relative;width:34%;aspect-ratio:1}
.x::before,.x::after{content:"";position:absolute;left:50%;top:50%;width:100%;height:2px;margin:-1px 0 0 -50%;border-radius:2px;background:var(--mark)}
.x::before{transform:rotate(45deg)}.x::after{transform:rotate(-45deg)}
.dot{width:13%;aspect-ratio:1;border-radius:50%;background:var(--mark);opacity:.5}
.tag{position:absolute;left:4px;top:2px;font-size:9px;line-height:1.2;font-weight:600;color:var(--mark)}
.cell.bad .fill{box-shadow:inset 0 0 0 3px var(--danger)}
.cell.flag .fill{box-shadow:inset 0 0 0 3px var(--ink)}
.cell.pop .in svg{animation:pop .26s cubic-bezier(.3,1.5,.5,1)}
.cell.bad .in svg{animation:wob .32s}
.cell.flag .in{animation:pulse .5s 3}
.cell.cheer .in svg{animation:cheer .6s cubic-bezier(.3,1.4,.5,1) both;animation-delay:var(--d,0s)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes wob{25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
@keyframes pulse{50%{transform:scale(1.25)}}
@keyframes cheer{40%{transform:translateY(-22%) scale(1.12)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.cell .in,.cell .in svg,#win{animation:none!important}}
#win{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow);animation:rise .35s ease-out}
#win strong{font-family:var(--display);font-weight:400;font-size:22px;color:var(--accent);display:block;line-height:1.3}
#win span{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
button.b{font:inherit;font-size:14px;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:transform .08s,border-color .15s}
button.b svg{width:17px;height:17px;flex:none;color:var(--muted)}
button.b:hover{border-color:var(--muted)}
button.b:active{transform:scale(.97)}
button.b:focus-visible,.sw:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.b.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);padding:10px 18px}
.opts{display:flex;gap:18px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.sw{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);border-radius:8px}
.sw::before{content:"";width:30px;height:18px;border-radius:9px;background:radial-gradient(circle at 9px 9px,var(--knob) 6px,transparent 6.5px),var(--line);box-shadow:inset 0 0 0 1px var(--line);transition:background .15s}
.sw[aria-pressed="true"]{color:var(--ink)}
.sw[aria-pressed="true"]::before{background:radial-gradient(circle at 21px 9px,var(--on-accent) 6px,transparent 6.5px),var(--accent);box-shadow:none}
#msg{font-size:13.5px;color:var(--muted);min-height:22px;text-align:right;flex:1;min-width:120px}
h2{font-size:13px;font-weight:600;margin:10px 0 0;color:var(--muted);display:flex;align-items:baseline;gap:8px}
h2 b{color:var(--ink);font-size:15px}
#levels{display:flex;flex-direction:column;gap:8px;margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.chip{font:inherit;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;display:flex;align-items:center;gap:10px;min-width:0;transition:transform .08s,border-color .15s}
.chip:hover{border-color:var(--muted)}
.chip:active{transform:scale(.98)}
.chip.cur{border-color:var(--accent);background:linear-gradient(var(--accent-soft),var(--accent-soft)),var(--surface)}
.thumb{width:42px;height:42px;flex:none;border-radius:8px;overflow:hidden;display:block}
.thumb rect{fill:color-mix(in srgb,var(--c) var(--rp),var(--rb))}
.thumb.q{display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--muted);color:var(--muted);font-size:18px;font-weight:600;box-sizing:border-box}
.chip div{min-width:0;display:flex;flex-direction:column}
.chip b{font-weight:600;font-size:14.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chip small.ok{color:var(--accent);font-weight:500}
</style>
</head>

<div class="wrap">

<script>
const Engine=(()=>{
  const D4=[[1,0],[-1,0],[0,1],[0,-1]];
  function masks(g,N){const rm=Array.from({length:N},()=>new Int32Array(N));
    for(let r=0;r<N;r++)for(let c=0;c<N;c++)rm[g[r][c]][r]|=1<<c;return rm;}
  function solve(g,N,limit,ref){const rm=masks(g,N),cur=new Int32Array(N),out=[];let alt=null;
    (function go(r,cm,gm,prev){
      if(out.length>=limit)return;
      if(r===N){const s=Array.from(cur);out.push(s);if(ref&&s.some((v,i)=>v!==ref[i]))alt=s;return;}
      for(let k=0;k<N;k++)if(!(gm>>k&1)){let ok=false;for(let rr=r;rr<N;rr++)if(rm[k][rr]&~cm){ok=true;break;}if(!ok)return;}
      for(let c=0;c<N;c++){if(cm>>c&1)continue;const k=g[r][c];if(gm>>k&1)continue;if(prev>=0&&Math.abs(prev-c)<=1)continue;
        cur[r]=c;go(r+1,cm|1<<c,gm|1<<k,c);}
    })(0,0,0,-1);
    return {sols:out,alt};}
  function connected(g,N,k){let start=null,tot=0;
    for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(g[r][c]===k){tot++;start=[r,c];}
    if(!tot)return false;const seen=new Set([start[0]*N+start[1]]),st=[start];let cnt=0;
    while(st.length){const [r,c]=st.pop();cnt++;
      for(const [dr,dc] of D4){const a=r+dr,b=c+dc;
        if(a>=0&&a<N&&b>=0&&b<N&&g[a][b]===k&&!seen.has(a*N+b)){seen.add(a*N+b);st.push([a,b]);}}}
    return cnt===tot;}
  function generate(N,rnd=Math.random){const ri=n=>Math.floor(rnd()*n);
    for(let attempt=0;attempt<200;attempt++){
      let cols;
      for(;;){cols=[...Array(N).keys()];for(let i=N-1;i>0;i--){const j=ri(i+1);[cols[i],cols[j]]=[cols[j],cols[i]];}
        let ok=true;for(let i=0;i<N-1;i++)if(Math.abs(cols[i]-cols[i+1])<=1)ok=false;if(ok)break;}
      const g=Array.from({length:N},()=>new Array(N).fill(-1));
      for(let k=0;k<N;k++)g[k][cols[k]]=k;
      let left=N*N-N;
      while(left){const r=ri(N),c=ri(N);if(g[r][c]!==-1)continue;const nb=[];
        for(const [dr,dc] of D4){const a=r+dr,b=c+dc;if(a>=0&&a<N&&b>=0&&b<N&&g[a][b]!==-1)nb.push(g[a][b]);}
        if(nb.length){g[r][c]=nb[ri(nb.length)];left--;}}
      for(let it=0;it<300;it++){
        const {sols,alt}=solve(g,N,2,cols);
        if(sols.length===1)return {grid:g.map(row=>row.map(k=>String.fromCharCode(65+k)).join('')),sol:cols};
        if(!alt)break;
        const idx=[];for(let r=0;r<N;r++)if(alt[r]!==cols[r])idx.push(r);
        let done=false;
        for(let t=0;t<idx.length*3&&!done;t++){const r=idx[ri(idx.length)],c=alt[r],old=g[r][c];
          const [dr,dc]=D4[ri(4)],a=r+dr,b=c+dc;if(a<0||a>=N||b<0||b>=N)continue;
          const k=g[a][b];if(k===old)continue;g[r][c]=k;if(connected(g,N,old))done=true;else g[r][c]=old;}
      }
    }
    return null;}
  function parse(rows){return rows.map(s=>[...s].map(ch=>ch.charCodeAt(0)-65));}
  return {solve,generate,parse};
})();

    box.appendChild(sh);});}
function start(data){const cur=data&&data.cur||store.cur;
  if(cur&&Array.isArray(cur.rows)&&cur.rows.length>=4)load({id:cur.id,name:cur.name,rows:cur.rows},cur);else load(FLAT[0]);
  clearInterval(timer);timer=setInterval(()=>{if(S&&S.started&&!S.done&&!document.hidden){S.sec++;$('clock').textContent=fmt(S.sec);if(S.sec%5===0)save();}},1000);}
start({});
</script>
