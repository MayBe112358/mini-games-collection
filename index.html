<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小游戏合集</title>
  <script src="./games.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --muted: #667386;
      --line: #d9e1ea;
      --panel: #ffffff;
      --soft: #f3f7fb;
      --brand: #e6544f;
      --brand-dark: #b83d39;
      --green: #12805c;
      --yellow: #f2b23a;
      --blue: #2f6fca;
      --shadow: 0 18px 45px rgba(38, 52, 70, .14);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #eef4f8;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(242,178,58,.18), transparent 30%),
        linear-gradient(225deg, rgba(47,111,202,.16), transparent 28%),
        #eef4f8;
    }

    button,
    input,
    a {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 34px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #17212b;
      color: #fff;
      font-size: 24px;
      box-shadow: 0 8px 18px rgba(23, 33, 43, .24);
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 42px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .brand p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(72px, 1fr));
      gap: 8px;
      width: min(330px, 100%);
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.82);
      padding: 10px 12px;
      min-width: 0;
    }

    .stat b {
      display: block;
      font-size: 20px;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .tools {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 12px;
      margin-bottom: 18px;
    }

    .search {
      position: relative;
    }

    .search svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #7b8796;
      pointer-events: none;
    }

    .search input {
      width: 100%;
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.88);
      padding: 0 14px 0 42px;
      color: var(--ink);
      outline: none;
      box-shadow: 0 8px 22px rgba(38, 52, 70, .06);
    }

    .search input:focus {
      border-color: #92afd9;
      box-shadow: 0 0 0 3px rgba(47,111,202,.14);
    }

    .filters {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .filter {
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.88);
      color: var(--muted);
      padding: 0 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: .18s ease;
    }

    .filter:hover,
    .filter.active {
      border-color: #17212b;
      color: #fff;
      background: #17212b;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      align-items: stretch;
    }

    .game-card {
      display: grid;
      grid-template-rows: auto 1fr;
      border: 1px solid rgba(154, 169, 187, .56);
      border-radius: 8px;
      overflow: hidden;
      background: var(--panel);
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .thumb {
      position: relative;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: #ced9e5;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scale(1.01);
    }

    .thumb-fallback {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f5d889, #75c5ad 52%, #94acd8);
      color: rgba(23, 33, 43, .9);
      font-size: 58px;
      font-weight: 900;
    }

    .badge-row {
      position: absolute;
      left: 10px;
      right: 10px;
      top: 10px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      pointer-events: none;
    }

    .badge {
      min-height: 26px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 4px 9px;
      color: #fff;
      background: rgba(23, 33, 43, .78);
      backdrop-filter: blur(8px);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge.live {
      background: rgba(18, 128, 92, .88);
    }

    .content {
      display: grid;
      gap: 14px;
      padding: 16px;
    }

    .title-row {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
    }

    .title-row h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.16;
      letter-spacing: 0;
    }

    .version {
      flex: 0 0 auto;
      border-radius: 999px;
      border: 1px solid #d6e1ec;
      color: #576474;
      background: #f5f8fb;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 700;
    }

    .desc {
      margin: 0;
      min-height: 44px;
      color: #536273;
      line-height: 1.55;
      font-size: 14px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      min-height: 30px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      border-radius: 999px;
      background: var(--soft);
      color: #506070;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 700;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 2px;
    }

    .action {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-weight: 800;
      transition: .18s ease;
    }

    .action svg {
      width: 18px;
      height: 18px;
    }

    .action.primary {
      border-color: var(--brand);
      background: var(--brand);
      color: #fff;
    }

    .action:hover {
      transform: translateY(-1px);
      border-color: #17212b;
      box-shadow: 0 8px 16px rgba(38, 52, 70, .14);
    }

    .action.primary:hover {
      border-color: var(--brand-dark);
      background: var(--brand-dark);
    }

    .empty {
      display: none;
      border: 1px dashed #a7b6c6;
      border-radius: 8px;
      background: rgba(255,255,255,.68);
      padding: 28px;
      text-align: center;
      color: var(--muted);
    }

    .empty.show {
      display: block;
    }

    @media (max-width: 760px) {
      .shell {
        width: min(100% - 22px, 560px);
        padding-top: 16px;
      }

      .topbar {
        display: grid;
        gap: 16px;
      }

      .stats {
        width: 100%;
      }

      .tools {
        grid-template-columns: 1fr;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
      }
    }

    @media (max-width: 390px) {
      .shell {
        width: min(100% - 16px, 560px);
      }

      .stats {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .stat {
        padding: 9px 8px;
      }

      .stat span {
        font-size: 11px;
      }

      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="topbar" aria-label="合集概览">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">🎮</div>
        <div>
          <h1>小游戏合集</h1>
          <p>轻量、好玩、持续更新</p>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><b id="totalCount">0</b><span>已收录</span></div>
        <div class="stat"><b id="liveCount">0</b><span>已部署</span></div>
        <div class="stat"><b id="categoryCount">0</b><span>分类</span></div>
      </div>
    </section>

    <section class="tools" aria-label="筛选游戏">
      <label class="search" aria-label="搜索游戏">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m21 21-4.3-4.3m2.3-5.2a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" type="search" placeholder="搜索名称、玩法、标签" autocomplete="off">
      </label>
      <div class="filters" id="filters" aria-label="游戏分类"></div>
    </section>

    <section class="grid" id="gameGrid" aria-label="游戏列表"></section>
    <div class="empty" id="emptyState">没有匹配的小游戏</div>
  </main>

  <script>
    const state = {
      query: "",
      category: "全部"
    };

    const icon = {
      play: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 5v14l11-7L8 5Z" fill="currentColor"/></svg>',
      external: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 5h5v5m0-5-9 9M19 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    };

    function normalize(value) {
      return String(value || "").trim().toLowerCase();
    }

    function getCategories() {
      return ["全部", ...new Set(games.map(game => game.category).filter(Boolean))];
    }

    function matches(game) {
      const text = normalize([
        game.title,
        game.subtitle,
        game.description,
        game.category,
        ...(game.tags || [])
      ].join(" "));
      const categoryOk = state.category === "全部" || game.category === state.category;
      return categoryOk && text.includes(normalize(state.query));
    }

    function renderStats() {
      document.querySelector("#totalCount").textContent = games.length;
      document.querySelector("#liveCount").textContent = games.filter(game => game.liveUrl).length;
      document.querySelector("#categoryCount").textContent = getCategories().length - 1;
    }

    function renderFilters() {
      const filters = document.querySelector("#filters");
      filters.innerHTML = getCategories().map(category => `
        <button class="filter ${category === state.category ? "active" : ""}" type="button" data-category="${category}">
          ${category}
        </button>
      `).join("");
    }

    function renderGames() {
      const grid = document.querySelector("#gameGrid");
      const empty = document.querySelector("#emptyState");
      const visibleGames = games.filter(matches);

      grid.innerHTML = visibleGames.map(game => {
        const tags = (game.tags || []).map(tag => `<span class="tag">${tag}</span>`).join("");
        const thumb = game.thumbnail
          ? `<img src="${game.thumbnail}" alt="${game.title} 截图" loading="eager" decoding="async" onerror="this.parentElement.innerHTML='<div class=&quot;thumb-fallback&quot;>${game.emoji || "🎮"}</div>'">`
          : `<div class="thumb-fallback">${game.emoji || "🎮"}</div>`;
        const liveButton = game.liveUrl
          ? `<a class="action" href="${game.liveUrl}" target="_blank" rel="noopener">${icon.external}<span>线上</span></a>`
          : `<span class="action" aria-disabled="true">${icon.external}<span>待部署</span></span>`;

        return `
          <article class="game-card">
            <a class="thumb" href="${game.localUrl}" target="_blank" rel="noopener" aria-label="打开 ${game.title}">
              ${thumb}
              <div class="badge-row">
                <span class="badge">${game.category || "游戏"}</span>
                ${game.liveUrl ? '<span class="badge live">已部署</span>' : ""}
              </div>
            </a>
            <div class="content">
              <div class="title-row">
                <h2>${game.title}</h2>
                <span class="version">${game.version || "HTML"}</span>
              </div>
              <p class="desc">${game.description || ""}</p>
              <div class="meta">${tags}</div>
              <div class="actions">
                <a class="action primary" href="${game.localUrl}" target="_blank" rel="noopener">${icon.play}<span>本地</span></a>
                ${liveButton}
              </div>
            </div>
          </article>
        `;
      }).join("");

      empty.classList.toggle("show", visibleGames.length === 0);
    }

    function render() {
      renderStats();
      renderFilters();
      renderGames();
    }

    document.querySelector("#searchInput").addEventListener("input", event => {
      state.query = event.target.value;
      renderGames();
    });

    document.querySelector("#filters").addEventListener("click", event => {
      const button = event.target.closest("[data-category]");
      if (!button) return;
      state.category = button.dataset.category;
      renderFilters();
      renderGames();
    });

    render();
  </script>
</body>
</html>
